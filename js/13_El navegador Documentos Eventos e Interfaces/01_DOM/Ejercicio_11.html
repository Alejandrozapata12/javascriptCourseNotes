<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 11</title>

  <style>
    #drop-zone {
      width: 400px;
      height: 200px;
      border: 3px dashed #555;
      border-radius: 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 20px;

      transition: .3s;
    }

    #drop-zone.active {
      background: #d9ecff;
      border-color: #2196f3;
    }
  </style>
</head>

<body>

  <div id="drop-zone">
    Arrastra un archivo aquí
  </div>


  <script>
    const zona = document.getElementById("drop-zone");

    // Evita que el navegador abra el archivo
    zona.addEventListener("dragover", (event) => {
      event.preventDefault();
    });

    // Cuando entra un archivo
    zona.addEventListener("dragenter", () => {
      zona.classList.add("active");
    });

    // Cuando sale
    zona.addEventListener("dragleave", () => {
      zona.classList.remove("active");
    });

    // Cuando lo suelta
    zona.addEventListener("drop", (event) => {

      event.preventDefault();

      zona.classList.remove("active");

      const archivos = event.dataTransfer.files;

      console.log(archivos);

    });
  </script>

</body>

</html>
