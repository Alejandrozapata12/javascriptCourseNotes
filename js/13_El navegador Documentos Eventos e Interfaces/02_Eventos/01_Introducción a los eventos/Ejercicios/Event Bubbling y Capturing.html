<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Bubbling y Capturing</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family: Arial;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f3f3f3;

    }

    .hidden {
      display: none;
    }

    #overlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, .6);

      display: flex;

      justify-content: center;
      align-items: center;

    }

    .modal {

      width: 400px;

      background: white;

      padding: 30px;

      border-radius: 10px;

      position: relative;

    }

    #closeModal {

      position: absolute;

      right: 15px;

      top: 15px;

      border: none;

      background: none;

      font-size: 20px;

      cursor: pointer;

    }
  </style>
</head>

<body>

  <button id="openModal">
    Abrir Modal
  </button>

  <div id="overlay" class="hidden">

    <div class="modal">

      <button id="closeModal">✖</button>

      <h2>Bienvenido</h2>

      <p>
        Este es un modal creado únicamente con HTML, CSS y JavaScript.
      </p>

      <button>
        Guardar cambios
      </button>

    </div>

  </div>


  <script>
    const openModal = document.getElementById("openModal");
    const closeModal = document.getElementById("closeModal");
    const overlay = document.getElementById("overlay");
    const modal = document.querySelector(".modal");

    // Abrir modal
    openModal.addEventListener("click", () => {
      overlay.classList.remove("hidden");
    });

    // Cerrar con la X
    closeModal.addEventListener("click", () => {
      overlay.classList.add("hidden");
    });

    // Cerrar haciendo clic en el fondo oscuro
    overlay.addEventListener("click", () => {
      overlay.classList.add("hidden");
    });

    // Evitar que el clic dentro del modal llegue al overlay
    modal.addEventListener("click", (event) => {
      event.stopPropagation();
    });

  </script> 
</body>
</html>
