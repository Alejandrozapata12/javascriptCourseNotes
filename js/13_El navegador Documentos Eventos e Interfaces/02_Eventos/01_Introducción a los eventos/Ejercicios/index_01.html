<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --color-principal: #1e90ff;
      --color-secundario: darkblue;
      --background-color: #f4f4f4;
      --back-Form: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--background-color);
    }

    #formProducto {
      width: 400px;
      margin: 50px auto;
      padding: 20px;
      background-color: var(--back-Form);
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    #formProducto input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #formProducto button {
      width: 100%;
      padding: 10px;
      background-color: var(--color-principal);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #formProducto button:hover {
      background-color: var(--color-secundario);
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: var(--color-secundario);
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="toast"></div>

  <form id="formProducto">
    <input type="text" id="nombreProducto" placeholder="Nombre del producto" >
    <input type="number" id="precioProducto" placeholder="Precio del producto" >
    <button type="submit">Agregar Producto</button>
  </form>


  <script>
   const forms = document.querySelector("#formProducto");
   const toast = document.querySelector(".toast");

   forms.addEventListener("submit", (e) => {
      e.preventDefault();
      const nombre = document.querySelector("#nombreProducto").value;
      const precio = document.querySelector("#precioProducto").value;

    
      if (nombre && precio) {
         toast.textContent = `Producto agregado: ${nombre} - $${precio}`;
         toast.style.display = "block";
         setTimeout(() => {
            toast.style.display = "none";
         }, 3000);
         forms.reset();
      } else {
         toast.textContent = "Por favor, complete todos los campos.";
         toast.style.display = "block";
         setTimeout(() => {
            toast.style.display = "none";
         }, 3000);
      }
   });
  </script>
</body>

</html>
