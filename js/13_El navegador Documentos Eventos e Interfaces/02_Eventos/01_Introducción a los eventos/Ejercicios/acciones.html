<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Glassmorphism</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Fondo con degradado vivo para que el efecto vidrio resalte */
            background: linear-gradient(135deg, #2f3e1b 0%, #606c38 50%, #15616d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        form {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-flow: column nowrap;
            gap: 1.2rem;
            
            /* --- EFECTO GLASSMORPHISM --- */
            background: rgba(255, 255, 255, 0.07); /* Fondo blanco muy transparente */
            backdrop-filter: blur(16px);            /* Desenfoque del fondo */
            -webkit-backdrop-filter: blur(16px);    /* Soporte para Safari */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); /* Borde sutil brillante */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .title {
            color: #ffffff;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 4px;
        }

        input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem; 
            width: 100%;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 300ms ease;
        }

        /* Cambiar el color del texto placeholder */
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        /* Quitar flechas nativas del input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            background: #ffffff;
            color: #15616d;
            font-size: 1rem;
            font-weight: 600;
            transition: all 300ms ease;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        /* --- CONTENEDOR DE TOASTS --- */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        /* Estilo Glass para los Toasts */
        .toast {
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            min-width: 280px;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .toast.success { background-color: rgba(42, 157, 143, 0.85); }
        .toast.error { background-color: rgba(231, 111, 81, 0.85); }

        .toast.hide {
            animation: slideOut 0.3s ease-in forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <form id="formulario">
        <h1 class="title">Crear cuenta</h1>

        <label for="fullname">Nombre completo</label>
        <input type="text" placeholder="Ej: Alejandro..." id="fullname">

        <label for="pass">Contraseña</label>
        <input type="password" placeholder="**************" id="pass">

        <label for="repeatpass">Confirmación de contraseña</label>
        <input type="password" placeholder="**************" id="repeatpass">

        <label for="tel">Teléfono</label>
        <input type="number" placeholder="3330000111" id="tel">
      
         <button type="submit" id="btn">Registrarse</button>
    </form>

    <div id="toast-container"></div>

    <script>
        const form = document.querySelector("#formulario");
        const nameInp = document.querySelector("#fullname");
        const pass = document.querySelector("#pass");
        const rPass = document.querySelector("#repeatpass");
        const tel = document.querySelector("#tel");

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.classList.add('toast', type);
            toast.textContent = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2500);
        }

        form.addEventListener("submit", (evento) => {
             evento.preventDefault();

             const n = nameInp.value.trim();
             const p = pass.value.trim();
             const rp = rPass.value.trim();
             const tl = tel.value.trim();
            
             if(n === "" || p === "" || rp === "" || tl === ""){
                 showToast("No se pueden dejar espacios vacíos", "error");
                 return; 
             }

             if (p !== rp) {
                 showToast("Las contraseñas no coinciden", "error");
                 return; 
             }

             showToast("¡Registro completado con éxito!", "success");
        });
    </script>
</body>
</html>
