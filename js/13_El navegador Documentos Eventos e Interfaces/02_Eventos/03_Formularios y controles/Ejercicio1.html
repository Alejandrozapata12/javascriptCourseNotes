<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Forms</title>
</head>
<body>

<form id="login">

    <input
        type="text"
        name="nombre"
        placeholder="Ingresa tu nombre">

    <input
        type="password"
        name="password"
        placeholder="********">

</form>

<p id="text"></p>

<script>

const txt = document.querySelector("#text");

const formpp = document.querySelector("#login");

const nombre = formpp.elements.nombre.value;

txt.textContent = "Nombre: " + nombre;

</script>

</body>
</html>
