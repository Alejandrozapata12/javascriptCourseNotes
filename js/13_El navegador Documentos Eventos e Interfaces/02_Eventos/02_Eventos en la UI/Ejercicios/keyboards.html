<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Keyboard Events</title>

    <style>
        body {

            font-family: Arial;

            padding: 40px;

        }

        #box {

            width: 200px;

            height: 200px;

            background: #2196f3;

            position: absolute;

            left: 100px;

            top: 120px;

            border-radius:11px;

        }
    </style>

</head>

<body>

    <h2>Usa las flechas del teclado</h2>

    <div id="box"></div>

    <script>
        const box = document.querySelector("#box");

        let x = 100;
        let y = 120;

        document.addEventListener("keydown", (event) => {

            switch (event.key) {

                case "ArrowLeft":
                    x -= 10;
                    break;

                case "ArrowRight":
                    x += 10;
                    break;

                case "ArrowUp":
                    y -= 10;
                    break;

                case "ArrowDown":
                    y += 10;
                    break;

            }

            box.style.left = x + "px";
            box.style.top = y + "px";

        });
    </script>

</body>

</html>
