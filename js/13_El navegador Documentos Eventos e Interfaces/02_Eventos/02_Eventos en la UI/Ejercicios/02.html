<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviendo el Mouse</title>
    <style>
        .contenedor-laboratorio {
  display: flex;
  gap: 30px;
  padding: 20px;
  font-family: sans-serif;
}

.caja-prueba {
  width: 250px;
  height: 200px;
  background-color: #34495e;
  color: white;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 300ms ease;
}

.caja-prueba:hover{
    transform: scale(0.9);
}

.hijo {
  background-color: #e74c3c;
  padding: 15px;
  border-radius: 4px;
  font-weight: bold;
}

span {
  font-size: 1.5rem;
  font-weight: bold;
  color: #2ecc71;
}
    </style>
</head>
<body>
    <div class="contenedor-laboratorio">
  
  <div class="caja-prueba" id="caja-over">
    <h3>Bando over / out</h3>
    <div class="hijo">Soy el Hijo</div>
    <p>Eventos: <span id="count-over">0</span></p>
  </div>

  <div class="caja-prueba" id="caja-enter">
    <h3>Bando enter / leave</h3>
    <div class="hijo">Soy el Hijo</div>
    <p>Eventos: <span id="count-enter">0</span></p>
  </div>

</div>

<script>
  // Elementos del bando OVER / OUT
const cajaOver = document.getElementById('caja-over');
const countOver = document.getElementById('count-over');
let numOver = 0;

cajaOver.addEventListener('mouseover', () => {
  numOver++;
  countOver.textContent = numOver;
});

// Elementos del bando ENTER / LEAVE
const cajaEnter = document.getElementById('caja-enter');
const countEnter = document.getElementById('count-enter');
let numEnter = 0;

cajaEnter.addEventListener('mouseenter', () => {
  numEnter++;
  countEnter.textContent = numEnter;
});
</script>
</body>
</html>
