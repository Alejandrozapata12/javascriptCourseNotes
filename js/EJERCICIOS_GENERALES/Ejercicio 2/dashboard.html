<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AuthCore Dashboard</title>

    <!-- INTER FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CHART JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <div class="logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-chart-simple"></i>
                </div>

                <div>
                    <h2>AuthCore</h2>
                    <span>Dashboard</span>
                </div>

            </div>

            <!-- NAVIGATION -->

            <nav>

                <a href="#" id="dashboardLink">
                    <i class="fa-solid fa-table-columns"></i>
                    Dashboard
                </a>

                <a href="#" id="reportsLink">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>

                <a href="#" id="settingsLink">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>

            </nav>

        </div>

        <!-- FOOTER -->

        <div class="sidebar-footer">

            <a href="#" id="logOut">
                <i class="fa-solid fa-right-from-bracket"></i>
                Log Out
            </a>

        </div>

    </aside>

    <!-- MAIN -->

    <main>

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Search...">

            </div>

            <button id="themeToggle" title="Toggle dark mode">
                <i class="fa-solid fa-moon"></i>
            </button>

        </header>

        <!-- DYNAMIC CONTENT -->

        <div id="app"></div>

    </main>

    <!-- LOGOUT MODAL -->

    <div class="logout-alert" id="logoutAlert">

        <div class="logout-box">

            <h2>Log out?</h2>

            <p>Your current session will be closed.</p>

            <div class="logout-buttons">

                <button id="cancelLogout">
                    Cancel
                </button>

                <button id="confirmLogout">
                    Log out
                </button>

            </div>

        </div>

    </div>

    <!-- MAIN APP -->

    <script type="module" src="./js/app.js"></script>

</body>

</html>
