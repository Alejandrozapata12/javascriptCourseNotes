<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AuthCore</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1 class="logo">AuthCore</h1>
        <div class="cont_itm">
            <a href="#" class="item">Security</a>
            <a href="#" class="item">Help</a>
        </div>
    </header>

    <main>
        <div id="login_container">
            <h2 class="title_logic">Welcome Back</h2>
            <h3 class="subtitle">Please enter your details to sign in.</h3>

            <form action="#">
                <label for="emal" class="email">Email Address:</label>
                <input type="text" name="email" id="email_inp" placeholder="name@company.com" autocomplete="off">

                <div class="password_cont">
                    <div class="forgot_di">
                        <a href="#" class="forgot" id="openForgot">Forgot password?</a>
                    </div>
                    <label for="pass" class="label_pass">Password:</label>
                    <input type="password" name="pass" id="pass_inp" placeholder="************">
                </div>

                <div class="remeber_cont">
                    <input type="checkbox" name="remember" id="check_rem">
                    <h2 class="title_rem">Remember me for 30 days</h2>
                </div>
            </form>

            <button type="submit" id="btn">Sign in</button>

            <span id="mensaje"></span>
        </div>
    </main>

    <footer>
        <div class="con_terms_foot">
            <a href="#" class="item">Privacy Policy</a>
            <a href="#" class="item">Terms of service</a>
            <a href="#" class="item">Help Center</a>
        </div>
        <div class="signUp">
            <span id="dont">Don't have an account?</span>
            <a href="#" id="up">Sign Up for free</a>
        </div>
        <div class="reserv">
            <span id="reserve">© 2026 AuthCore Inc.</span>
        </div>
    </footer>


    <!-- SIGN UP MODAL -->
<div class="modal" id="signupModal">
    <div class="modal-content">

        <span class="close" id="closeSignUp">&times;</span>

        <h2>Create Account</h2>

        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>

        <button>Create Account</button>

    </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal" id="forgotModal">
    <div class="modal-content">

        <span class="close" id="closeForgot">&times;</span>

        <h2>Forgot Password</h2>

        <input type="email" placeholder="Enter your email" required>

        <button type="submit">Send Recovery Link</button>

    </div>
</div>

    <script src="logic.js"></script>
</body>

</html>
